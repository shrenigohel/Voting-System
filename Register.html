<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Voting System</title>
    <link rel="stylesheet" href="Register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="register-container">
        <div class="register-header">
            <div class="header-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 class="app-title">Create Account</h1>
            <p class="app-subtitle">Join E-Voting System Today</p>
        </div>

        <div class="register-card">
            <!-- Role Tabs -->
            <div class="role-tabs">
                <button class="tab-btn active" data-role="voter" onclick="switchRole('voter')">
                    <i class="fas fa-user"></i> Voter
                </button>
                <button class="tab-btn" data-role="candidate" onclick="switchRole('candidate')">
                    <i class="fas fa-user-tie"></i> Candidate
                </button>
            </div>

            <!-- Voter Registration Form -->
            <form id="voterForm" class="registration-form active" onsubmit="return handleRegister(event, 'voter')">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="voterName" class="form-input" placeholder="Enter your full name" required>
                    <span class="error-message" id="voterNameError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="voterEmail" class="form-input" placeholder="your.email@example.com"
                        required>
                    <span class="error-message" id="voterEmailError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="voterPhone" class="form-input" placeholder="10-digit mobile number" required>
                    <span class="error-message" id="voterPhoneError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="voterPassword" class="form-input"
                            placeholder="Create a strong password" required>
                        <span class="toggle-password" onclick="togglePassword('voterPassword', this)">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <small class="form-hint">At least 8 characters with 1 uppercase & 1 special character</small>
                    <span class="error-message" id="voterPasswordError"></span>
                </div>

                <button type="submit" class="btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Register as Voter
                </button>
            </form>

            <!-- Candidate Registration Form -->
            <form id="candidateForm" class="registration-form" onsubmit="return handleRegister(event, 'candidate')">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="candidateName" class="form-input" placeholder="Enter your full name"
                        required>
                    <span class="error-message" id="candidateNameError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="candidateEmail" class="form-input" placeholder="your.email@example.com"
                        required>
                    <span class="error-message" id="candidateEmailError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-flag"></i> Party Name</label>
                    <input type="text" id="candidateParty" class="form-input" placeholder="Enter your party name"
                        required>
                    <span class="error-message" id="candidatePartyError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="candidatePhone" class="form-input" placeholder="10-digit mobile number"
                        required>
                    <span class="error-message" id="candidatePhoneError"></span>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="candidatePassword" class="form-input"
                            placeholder="Create a strong password" required>
                        <span class="toggle-password" onclick="togglePassword('candidatePassword', this)">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <small class="form-hint">At least 8 characters with 1 uppercase & 1 special character</small>
                    <span class="error-message" id="candidatePasswordError"></span>
                </div>

                <button type="submit" class="btn-primary btn-block">
                    <i class="fas fa-user-tie"></i> Register as Candidate
                </button>
            </form>

            <div class="form-footer">
                <div class="login-link">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </div>

        <!-- Success Toast -->
        <div class="toast" id="successToast">
            <i class="fas fa-check-circle"></i>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="Register_storage.js"></script>
    <script src="login_storage.js"></script>
    <script src="Register.js"></script>
</body>

</html>
